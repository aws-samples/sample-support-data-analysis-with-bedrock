AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MAKITA (Machine Augmented Key Infrastructure Technology Automation) -
  Primary region CloudFormation stack (us-east-1) for multi-region PostgreSQL
  disaster recovery with MCP servers, AgentCore governance, and Bedrock
  Guardrails. Deploy makita-replica-stack.yaml to us-west-2 for the replica.

# =============================================================================
# Parameters
# =============================================================================
Parameters:
  DBMasterUsername:
    Type: String
    Default: makitaadmin
    Description: Master username for the PostgreSQL primary instance
    MinLength: 1
    MaxLength: 63

  ReplicaEndpoint:
    Type: String
    Default: pending-replica-deployment
    Description: >-
      Endpoint address of the cross-region read replica in us-west-2.
      Set this after deploying makita-replica-stack.yaml to us-west-2.

# =============================================================================
# Resources
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # Secrets Manager — Auto-generated master password for PostgreSQL
  # ---------------------------------------------------------------------------
  MakitaDbMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: makita-db-master-secret
      Description: Auto-generated master credentials for the MAKITA PostgreSQL primary instance
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DBMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  # ---------------------------------------------------------------------------
  # VPC and Networking — Primary Region (us-east-1)
  # ---------------------------------------------------------------------------
  MakitaVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: makita-vpc
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: makita-igw
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MakitaVpc
      InternetGatewayId: !Ref MakitaInternetGateway

  MakitaSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MakitaVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: makita-subnet-a
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MakitaVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: makita-subnet-b
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: makita-db-subnet-group
      DBSubnetGroupDescription: Subnet group for MAKITA PostgreSQL primary instance
      SubnetIds:
        - !Ref MakitaSubnetA
        - !Ref MakitaSubnetB
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: makita-db-sg
      GroupDescription: Security group for MAKITA PostgreSQL instances
      VpcId: !Ref MakitaVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
          Description: Allow PostgreSQL access from within the VPC
      Tags:
        - Key: Name
          Value: makita-db-sg
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  # ---------------------------------------------------------------------------
  # PostgreSQL Cluster — Primary Instance (us-east-1)
  # ---------------------------------------------------------------------------
  MakitaPgPrimary:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: makita-pg-primary
      Engine: postgres
      EngineVersion: "16.6"
      DBInstanceClass: db.t3.medium
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      MasterUsername: !Sub '{{resolve:secretsmanager:makita-db-master-secret:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:makita-db-master-secret:SecretString:password}}'
      DBName: makitadb
      Port: 5432
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      StorageEncrypted: true
      CopyTagsToSnapshot: true
      DeletionProtection: false
      DBSubnetGroupName: !Ref MakitaDbSubnetGroup
      VPCSecurityGroups:
        - !GetAtt MakitaDbSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: makita-pg-primary
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  # ---------------------------------------------------------------------------
  # Secrets Manager — Attach secret to the RDS primary instance
  # ---------------------------------------------------------------------------
  MakitaDbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref MakitaDbMasterSecret
      TargetId: !Ref MakitaPgPrimary
      TargetType: AWS::RDS::DBInstance

  # ---------------------------------------------------------------------------
  # PostgreSQL Cluster — Read Replica (us-west-2, cross-region replication)
  # ---------------------------------------------------------------------------
  # The cross-region read replica is provisioned by a separate stack
  # (makita-replica-stack.yaml) deployed to us-west-2. After deploying
  # the replica stack, pass its endpoint as the ReplicaEndpoint parameter
  # to this stack so that Parameter Store is kept in sync.

  # ---------------------------------------------------------------------------
  # Parameter Store — Centralized Configuration (/makita/ prefix)
  # ---------------------------------------------------------------------------
  MakitaParamPrimaryEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/db/primary-endpoint
      Type: String
      Description: Current primary PostgreSQL endpoint
      Value: !GetAtt MakitaPgPrimary.Endpoint.Address
      Tags:
        auto-delete: "no"
        Env: prod1

  MakitaParamReplicaEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/db/replica-endpoint
      Type: String
      Description: Current replica PostgreSQL endpoint
      Value: !Ref ReplicaEndpoint
      Tags:
        auto-delete: "no"
        Env: prod1

  MakitaParamPrimaryRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/db/primary-region
      Type: String
      Description: Current primary region
      Value: us-east-1
      Tags:
        auto-delete: "no"
        Env: prod1

  MakitaParamDrRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/db/dr-region
      Type: String
      Description: Current DR region
      Value: us-west-2
      Tags:
        auto-delete: "no"
        Env: prod1

  MakitaParamClusterName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/db/cluster-name
      Type: String
      Description: PostgreSQL cluster name
      Value: makita-pg-cluster
      Tags:
        auto-delete: "no"
        Env: prod1

  MakitaParamReplicationStatus:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/db/replication-status
      Type: String
      Description: Current replication status
      Value: active
      Tags:
        auto-delete: "no"
        Env: prod1

  MakitaParamPort:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/db/port
      Type: String
      Description: PostgreSQL port
      Value: "5432"
      Tags:
        auto-delete: "no"
        Env: prod1

  # MCP Server ARN parameters — placeholder values until AgentCore
  # MCP Server resources are defined in task 2.4
  MakitaParamFailoverServerArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/mcp/failover-server-arn
      Type: String
      Description: ARN of the Failover MCP Server in AgentCore
      Value: !Sub "arn:aws:agentcore:us-east-1:${AWS::AccountId}:mcp-server/makita-failover-mcp"
      Tags:
        auto-delete: "no"
        Env: prod1

  MakitaParamPrecheckServerArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/mcp/precheck-server-arn
      Type: String
      Description: ARN of the Pre-Check MCP Server in AgentCore
      Value: !Sub "arn:aws:agentcore:us-east-1:${AWS::AccountId}:mcp-server/makita-precheck-mcp"
      Tags:
        auto-delete: "no"
        Env: prod1

  MakitaParamPostcheckServerArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /makita/mcp/postcheck-server-arn
      Type: String
      Description: ARN of the Post-Check MCP Server in AgentCore
      Value: !Sub "arn:aws:agentcore:us-east-1:${AWS::AccountId}:mcp-server/makita-postcheck-mcp"
      Tags:
        auto-delete: "no"
        Env: prod1

  # ---------------------------------------------------------------------------
  # IAM Roles — Dedicated roles for each MCP Server
  # ---------------------------------------------------------------------------

  # Failover MCP Server role: permissions for RDS failover operations
  # (promote replica, describe instances, reboot) and SSM parameter updates.
  MakitaFailoverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: makita-failover-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: makita-failover-rds-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:PromoteReadReplica
                  - rds:DescribeDBInstances
                  - rds:RebootDBInstance
                Resource:
                  - !Sub "arn:aws:rds:*:${AWS::AccountId}:db:makita-*"
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/makita/*"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  # Pre-Check MCP Server role: read-only permissions for RDS describe
  # and SSM get operations to verify cluster state before failover.
  MakitaPrecheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: makita-precheck-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: makita-precheck-readonly-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                Resource:
                  - !Sub "arn:aws:rds:*:${AWS::AccountId}:db:makita-*"
                  - !Sub "arn:aws:rds:*:${AWS::AccountId}:cluster:makita-*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/makita/*"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  # Post-Check MCP Server role: read-only permissions for RDS describe
  # and SSM get operations to verify cluster state after failover.
  MakitaPostcheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: makita-postcheck-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: makita-postcheck-readonly-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                Resource:
                  - !Sub "arn:aws:rds:*:${AWS::AccountId}:db:makita-*"
                  - !Sub "arn:aws:rds:*:${AWS::AccountId}:cluster:makita-*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/makita/*"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  # ===========================================================================
  # AgentCore Resources (MCP Servers, Policies, Identities)
  # ===========================================================================
  # AgentCore resources (AWS::AgentCore::McpServer, AWS::AgentCore::Policy,
  # AWS::AgentCore::Identity) require the AgentCore CloudFormation extension
  # to be registered in the account. These resources are defined in a separate
  # optional stack: infrastructure/makita-agentcore-stack.yaml
  # Deploy it after the primary stack if AgentCore is available in your account.

  # ===========================================================================
  # Bedrock Guardrails (Task 2.7)
  # ===========================================================================
  # Each guardrail includes: content filtering, topic restriction to DR
  # operations, prompt injection detection, and blocked input/output messaging.

  MakitaFailoverGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: makita-failover-guardrail
      Description: >-
        Governs the Failover MCP Server — restricts to DR failover actions
        on PostgreSQL, blocks prompt injection and malicious content.
      BlockedInputMessaging: >-
        Operation blocked by guardrail policy. The requested input violates
        the MAKITA failover guardrail. Only disaster recovery failover
        operations on the PostgreSQL cluster are permitted.
      BlockedOutputsMessaging: >-
        Response blocked by guardrail policy. The generated output violates
        the MAKITA failover guardrail constraints.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      TopicPolicyConfig:
        TopicsConfig:
          - Name: non-dr-operations
            Definition: >-
              Any operations that are not related to disaster recovery,
              PostgreSQL failover, database promotion, endpoint updates,
              or replication management for the MAKITA system.
            Type: DENY
            Examples:
              - "Delete all database records"
              - "Create a new user account"
              - "Send an email notification"
              - "Modify application source code"
              - "Access financial data"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaPrecheckGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: makita-precheck-guardrail
      Description: >-
        Governs the Pre-Check MCP Server — restricts to pre-check read
        actions on PostgreSQL, blocks prompt injection and malicious content.
      BlockedInputMessaging: >-
        Operation blocked by guardrail policy. The requested input violates
        the MAKITA pre-check guardrail. Only disaster recovery pre-check
        operations on the PostgreSQL cluster are permitted.
      BlockedOutputsMessaging: >-
        Response blocked by guardrail policy. The generated output violates
        the MAKITA pre-check guardrail constraints.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      TopicPolicyConfig:
        TopicsConfig:
          - Name: non-dr-operations
            Definition: >-
              Any operations that are not related to disaster recovery
              pre-checks, replication health verification, primary status
              checks, or replica readiness verification for the MAKITA system.
            Type: DENY
            Examples:
              - "Delete all database records"
              - "Modify database schema"
              - "Execute failover without checks"
              - "Access financial data"
              - "Send notifications"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaPostcheckGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: makita-postcheck-guardrail
      Description: >-
        Governs the Post-Check MCP Server — restricts to post-check read
        actions on PostgreSQL, blocks prompt injection and malicious content.
      BlockedInputMessaging: >-
        Operation blocked by guardrail policy. The requested input violates
        the MAKITA post-check guardrail. Only disaster recovery post-check
        operations on the PostgreSQL cluster are permitted.
      BlockedOutputsMessaging: >-
        Response blocked by guardrail policy. The generated output violates
        the MAKITA post-check guardrail constraints.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      TopicPolicyConfig:
        TopicsConfig:
          - Name: non-dr-operations
            Definition: >-
              Any operations that are not related to disaster recovery
              post-checks, new primary health verification, endpoint
              verification, or replication establishment checks for the
              MAKITA system.
            Type: DENY
            Examples:
              - "Delete all database records"
              - "Modify database schema"
              - "Roll back the failover"
              - "Access financial data"
              - "Send notifications"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  # ===========================================================================
  # CloudWatch Dashboard — removed from stack
  # ===========================================================================
  # NOTE: The CloudWatch Dashboard (makita-failover-dashboard) is not
  # provisioned by this stack. It can be created manually or via a
  # separate deployment if needed.

# =============================================================================
# Outputs (Task 2.9)
# =============================================================================
# All taggable resources above carry mandatory tags (auto-delete=no, Env=prod1).
Outputs:
  PrimaryEndpoint:
    Description: PostgreSQL primary instance endpoint (us-east-1)
    Value: !GetAtt MakitaPgPrimary.Endpoint.Address
    Export:
      Name: makita-primary-endpoint

  PrimaryInstanceArn:
    Description: ARN of the PostgreSQL primary instance (needed by replica stack)
    Value: !GetAtt MakitaPgPrimary.DBInstanceArn
    Export:
      Name: makita-primary-instance-arn

  DbMasterSecretArn:
    Description: ARN of the Secrets Manager secret containing DB master credentials
    Value: !Ref MakitaDbMasterSecret
    Export:
      Name: makita-db-master-secret-arn

  FailoverRoleArn:
    Description: ARN of the Failover MCP Server IAM role
    Value: !GetAtt MakitaFailoverRole.Arn
    Export:
      Name: makita-failover-role-arn

  PrecheckRoleArn:
    Description: ARN of the Pre-Check MCP Server IAM role
    Value: !GetAtt MakitaPrecheckRole.Arn
    Export:
      Name: makita-precheck-role-arn

  PostcheckRoleArn:
    Description: ARN of the Post-Check MCP Server IAM role
    Value: !GetAtt MakitaPostcheckRole.Arn
    Export:
      Name: makita-postcheck-role-arn

  ReplicaEndpoint:
    Description: PostgreSQL replica instance endpoint (us-west-2)
    Value: !Ref ReplicaEndpoint
    Export:
      Name: makita-replica-endpoint
