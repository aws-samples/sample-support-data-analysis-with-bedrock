AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Makita DR Reference - RDS Postgres Primary Instance (us-east-1).
  Deploy this stack first, then deploy rds-replica.yaml in us-east-2.

Parameters:
  DBMasterUsername:
    Type: String
    Default: makitaadmin
    Description: Master username for the RDS instance
  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Master password for the RDS instance
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy the RDS instance into
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different AZs for the DB subnet group

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Makita DR primary DB subnet group
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: makita-dr-primary-subnet-group

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Postgres access for Makita DR primary
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/8
      Tags:
        - Key: Name
          Value: makita-dr-primary-sg

  RDSPrimary:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: makita-dr-primary
      Engine: postgres
      EngineVersion: '16.4'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterPassword
      DBName: makitadr
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DBSecurityGroup.GroupId
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      MultiAZ: false
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: makita-dr-primary
        - Key: Project
          Value: makita-dr-reference

Outputs:
  PrimaryInstanceId:
    Description: RDS Primary instance identifier
    Value: !Ref RDSPrimary
    Export:
      Name: makita-dr-primary-instance-id
  PrimaryEndpoint:
    Description: RDS Primary endpoint address
    Value: !GetAtt RDSPrimary.Endpoint.Address
    Export:
      Name: makita-dr-primary-endpoint
  PrimaryArn:
    Description: RDS Primary instance ARN (needed for cross-region replica)
    Value: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:makita-dr-primary
    Export:
      Name: makita-dr-primary-arn
  PrimaryPort:
    Description: RDS Primary port
    Value: !GetAtt RDSPrimary.Endpoint.Port
