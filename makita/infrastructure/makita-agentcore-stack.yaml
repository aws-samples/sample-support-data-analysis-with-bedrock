AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MAKITA AgentCore Stack — Uses a Lambda-backed Custom Resource to create
  AgentCore MCP Servers, Policies, and Identities via boto3 SDK calls.
  Deploy to us-east-1 after deploying makita-stack.yaml.

Resources:

  MakitaAgentCoreLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: makita-agentcore-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: makita-agentcore-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - agentcore:*
                Resource: "*"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaAgentCoreLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: makita-agentcore-manager
      Runtime: python3.11
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt MakitaAgentCoreLambdaRole.Arn
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1
      Code:
        ZipFile: |
          import json, boto3, urllib3
          http = urllib3.PoolManager()

          SERVERS = [
            {"name": "makita-failover-mcp", "desc": "Failover MCP Server"},
            {"name": "makita-precheck-mcp", "desc": "Pre-Check MCP Server"},
            {"name": "makita-postcheck-mcp", "desc": "Post-Check MCP Server"},
            {"name": "makita-aws-support-stub", "desc": "AWS Support Stub"},
            {"name": "makita-servicenow-stub", "desc": "ServiceNow Stub"},
          ]

          POLICY_NAMES = [
            "makita-failover-policy",
            "makita-precheck-policy",
            "makita-postcheck-policy",
          ]

          def send_response(event, ctx, status, reason=None):
            r = reason or ctx.log_stream_name
            if len(r) > 256:
              r = r[:256]
            body = json.dumps({
              "Status": status,
              "Reason": r,
              "PhysicalResourceId": event.get("PhysicalResourceId", ctx.log_stream_name),
              "StackId": event["StackId"],
              "RequestId": event["RequestId"],
              "LogicalResourceId": event["LogicalResourceId"],
              "Data": {},
            })
            http.request("PUT", event["ResponseURL"], body=body, headers={"Content-Type": ""})

          def build_policy_doc(actions):
            return json.dumps({"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":actions,"Resource":"arn:aws:*:*:*:makita-*",
               "Condition":{"StringEquals":{"aws:RequestedRegion":["us-east-1","us-west-2"],
               "aws:PrincipalTag/Name":"makita-*"}}},
              {"Effect":"Deny","Action":"*","Resource":"*",
               "Condition":{"StringNotEquals":{"aws:ResourceTag/Env":"prod1"}}},
              {"Effect":"Deny","Action":"*","Resource":"*",
               "Condition":{"StringNotLike":{"aws:ResourceTag/Name":"makita-*"}}},
              {"Effect":"Deny","Action":"*","Resource":"*",
               "Condition":{"StringNotEquals":{"aws:RequestedRegion":["us-east-1","us-west-2"]}}},
              {"Effect":"Deny","Action":"*","Resource":"*",
               "Condition":{"StringNotLike":{"aws:PrincipalTag/Name":"makita-*"}}},
            ]})

          POLICIES = {
            "makita-failover-policy": {
              "desc": "Failover policy",
              "actions": ["rds:PromoteReadReplica","rds:DescribeDBInstances",
                          "rds:RebootDBInstance","ssm:PutParameter","ssm:GetParameter"],
            },
            "makita-precheck-policy": {
              "desc": "Pre-check policy",
              "actions": ["rds:DescribeDBInstances","rds:DescribeDBClusters","ssm:GetParameter"],
            },
            "makita-postcheck-policy": {
              "desc": "Post-check policy",
              "actions": ["rds:DescribeDBInstances","rds:DescribeDBClusters","ssm:GetParameter"],
            },
          }

          IDENTITIES = [
            {"name": "makita-failover-identity", "roleKey": "FailoverRoleArn"},
            {"name": "makita-precheck-identity", "roleKey": "PrecheckRoleArn"},
            {"name": "makita-postcheck-identity", "roleKey": "PostcheckRoleArn"},
          ]

          def handler(event, ctx):
            print(json.dumps(event))
            rt = event["RequestType"]
            props = event["ResourceProperties"]
            try:
              if rt in ("Create", "Update"):
                create(props)
              elif rt == "Delete":
                delete(props)
              send_response(event, ctx, "SUCCESS")
            except Exception as e:
              print(f"Error: {e}")
              send_response(event, ctx, "FAILED", str(e))

          def create(props):
            c = boto3.client("bedrock-agentcore-control")
            for s in SERVERS:
              try:
                c.create_mcp_server(serverName=s["name"], description=s["desc"])
                print(f"Created server: {s['name']}")
              except Exception as e:
                print(f"Server {s['name']}: {e}")
            for name, cfg in POLICIES.items():
              try:
                c.create_policy(policyName=name, description=cfg["desc"],
                                policyDocument=build_policy_doc(cfg["actions"]))
                print(f"Created policy: {name}")
              except Exception as e:
                print(f"Policy {name}: {e}")
            for ident in IDENTITIES:
              role = props.get(ident["roleKey"], "")
              if role:
                try:
                  c.create_identity(identityName=ident["name"], roleArn=role)
                  print(f"Created identity: {ident['name']}")
                except Exception as e:
                  print(f"Identity {ident['name']}: {e}")

          def delete(props):
            c = boto3.client("bedrock-agentcore-control")
            for ident in IDENTITIES:
              try:
                c.delete_identity(identityName=ident["name"])
              except Exception as e:
                print(f"Delete identity {ident['name']}: {e}")
            for name in POLICIES:
              try:
                c.delete_policy(policyName=name)
              except Exception as e:
                print(f"Delete policy {name}: {e}")
            for s in SERVERS:
              try:
                c.delete_mcp_server(serverName=s["name"])
              except Exception as e:
                print(f"Delete server {s['name']}: {e}")

  MakitaAgentCoreResources:
    Type: Custom::AgentCoreResources
    Properties:
      ServiceToken: !GetAtt MakitaAgentCoreLambda.Arn
      FailoverRoleArn: !ImportValue makita-failover-role-arn
      PrecheckRoleArn: !ImportValue makita-precheck-role-arn
      PostcheckRoleArn: !ImportValue makita-postcheck-role-arn

Outputs:
  AgentCoreResourceStatus:
    Value: "Created via Custom::AgentCoreResources Lambda"
