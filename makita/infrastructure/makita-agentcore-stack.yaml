AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MAKITA AgentCore Stack — Creates AgentCore Runtime, Endpoint, Gateway,
  Gateway Targets, Workload Identities, and Policies via Lambda Custom Resource.

Parameters:
  ArtifactBucket:
    Type: String
    Description: S3 bucket containing the MCP server code artifact
  ArtifactKey:
    Type: String
    Default: mcp-servers/makita-mcp-servers.zip
    Description: S3 key for the MCP server code artifact
  Boto3LayerArn:
    Type: String
    Default: ""
    Description: ARN of a Lambda layer with latest boto3 (optional)

Conditions:
  HasBoto3Layer: !Not [!Equals [!Ref Boto3LayerArn, ""]]

Resources:

  MakitaAgentCoreLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: makita-agentcore-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: makita-agentcore-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore-control:*
                  - bedrock-agentcore:*
                  - iam:PassRole
                Resource: "*"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1

  MakitaAgentCoreLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: makita-agentcore-manager
      Runtime: python3.11
      Handler: index.handler
      Timeout: 600
      MemorySize: 256
      Role: !GetAtt MakitaAgentCoreLambdaRole.Arn
      Layers: !If
        - HasBoto3Layer
        - [!Ref Boto3LayerArn]
        - !Ref "AWS::NoValue"
      Tags:
        - Key: auto-delete
          Value: "no"
        - Key: Env
          Value: prod1
      Code:
        ZipFile: |
          import json, boto3, urllib3, time
          http = urllib3.PoolManager()

          def send_response(event, ctx, status, reason=None):
            r = reason or ctx.log_stream_name
            if len(r) > 256:
              r = r[:256]
            body = json.dumps({
              "Status": status,
              "Reason": r,
              "PhysicalResourceId": event.get("PhysicalResourceId", ctx.log_stream_name),
              "StackId": event["StackId"],
              "RequestId": event["RequestId"],
              "LogicalResourceId": event["LogicalResourceId"],
              "Data": {},
            })
            http.request("PUT", event["ResponseURL"], body=body, headers={"Content-Type": ""})

          def handler(event, ctx):
            print(json.dumps(event))
            rt = event["RequestType"]
            props = event["ResourceProperties"]
            try:
              if rt in ("Create", "Update"):
                create(props)
              elif rt == "Delete":
                delete(props)
              send_response(event, ctx, "SUCCESS")
            except Exception as e:
              print(f"Error: {e}")
              send_response(event, ctx, "FAILED", str(e))

          def safe_call(fn, label, **kwargs):
            try:
              result = fn(**kwargs)
              print(f"OK: {label}")
              return result
            except Exception as e:
              if "Conflict" in str(type(e).__name__) or "already exists" in str(e).lower():
                print(f"Already exists: {label}")
              else:
                print(f"Error {label}: {e}")
              return None

          def wait_ready(c, get_fn, id_key, id_val, name_key, name_val, status_key, target, max_wait=300):
            for _ in range(max_wait // 10):
              try:
                r = get_fn(**{id_key: id_val, name_key: name_val}) if name_key else get_fn(**{id_key: id_val})
                s = r.get(status_key, "")
                print(f"  Status: {s}")
                if s == target:
                  return r
                if "FAILED" in s:
                  print(f"  Failed: {r}")
                  return None
              except Exception as e:
                print(f"  Wait error: {e}")
              time.sleep(10)
            return None

          def build_policy_doc(actions, gw_id=""):
            # For tool-specific policies, Cedar requires a specific gateway resource
            cedar_str = 'permit(principal, action, resource is AgentCore::Gateway);'
            return {"cedar": {"statement": cedar_str}}

          SERVERS = [
            {"name": "makita-failover-mcp", "desc": "Failover MCP Server"},
            {"name": "makita-precheck-mcp", "desc": "Pre-Check MCP Server"},
            {"name": "makita-postcheck-mcp", "desc": "Post-Check MCP Server"},
            {"name": "makita-aws-support-stub", "desc": "AWS Support Stub"},
            {"name": "makita-servicenow-stub", "desc": "ServiceNow Stub"},
          ]

          POLICIES = {
            "makita_failover_policy": {
              "desc": "Failover policy",
              "actions": ["rds:PromoteReadReplica","rds:DescribeDBInstances",
                          "rds:RebootDBInstance","ssm:PutParameter","ssm:GetParameter"],
            },
            "makita_precheck_policy": {
              "desc": "Pre-check policy",
              "actions": ["rds:DescribeDBInstances","rds:DescribeDBClusters","ssm:GetParameter"],
            },
            "makita_postcheck_policy": {
              "desc": "Post-check policy",
              "actions": ["rds:DescribeDBInstances","rds:DescribeDBClusters","ssm:GetParameter"],
            },
          }

          IDENTITIES = [
            {"name": "makita-failover-identity", "roleKey": "FailoverRoleArn"},
            {"name": "makita-precheck-identity", "roleKey": "PrecheckRoleArn"},
            {"name": "makita-postcheck-identity", "roleKey": "PostcheckRoleArn"},
          ]

          def create(props):
            c = boto3.client("bedrock-agentcore-control")
            role_arn = props.get("FailoverRoleArn", "")

            # 1. Create Gateway
            gw = None
            try:
              gw = c.create_gateway(
                name="makita-mcp-gateway",
                description="MAKITA MCP Gateway for DR operations",
                roleArn=role_arn,
                protocolType="MCP",
                authorizerType="CUSTOM_JWT",
                authorizerConfiguration={"customJWTAuthorizer": {
                  "discoveryUrl": "https://token.actions.githubusercontent.com/.well-known/openid-configuration",
                  "allowedAudience": ["makita-gateway"],
                }},
              )
              print(f"OK: Gateway created")
            except c.exceptions.ConflictException:
              print("Gateway already exists")
              try:
                for g in c.list_gateways().get("items", []):
                  if g.get("name") == "makita-mcp-gateway":
                    gw = g
                    break
              except Exception as e2:
                print(f"List gateways: {e2}")
            except Exception as e:
              print(f"Error Gateway: {str(e)[:200]}")
            gw_id = ""
            if gw:
              gw_id = gw.get("gatewayId", "")
              print(f"Gateway ID: {gw_id}")
              if gw_id:
                wait_ready(c, c.get_gateway, "gatewayIdentifier", gw_id,
                           None, None, "status", "READY")

            # 2. Create Gateway Targets with Lambda target type + inline tool schemas
            if gw_id:
              target_defs = {
                "makita-failover-target": {
                  "desc": "Failover MCP Server tools",
                  "tools": [
                    {"name": "execute_failover", "description": "Promotes DR replica to primary",
                     "inputSchema": {"type": "object", "properties": {
                       "primary_region": {"type": "string", "description": "Current primary region"},
                       "dr_region": {"type": "string", "description": "DR region"},
                       "cluster_name": {"type": "string", "description": "Cluster name"}},
                       "required": ["primary_region", "dr_region", "cluster_name"]}},
                    {"name": "health_check", "description": "Returns cluster health status",
                     "inputSchema": {"type": "object", "properties": {
                       "cluster_name": {"type": "string", "description": "Cluster name"}},
                       "required": ["cluster_name"]}},
                  ]},
                "makita-precheck-target": {
                  "desc": "Pre-Check MCP Server tools",
                  "tools": [
                    {"name": "verify_replication_health", "description": "Checks replication lag and state",
                     "inputSchema": {"type": "object", "properties": {
                       "cluster_name": {"type": "string"}}, "required": ["cluster_name"]}},
                    {"name": "verify_primary_status", "description": "Verifies primary instance status",
                     "inputSchema": {"type": "object", "properties": {
                       "cluster_name": {"type": "string"}, "primary_region": {"type": "string"}},
                       "required": ["cluster_name", "primary_region"]}},
                    {"name": "verify_replica_readiness", "description": "Verifies replica readiness",
                     "inputSchema": {"type": "object", "properties": {
                       "cluster_name": {"type": "string"}, "dr_region": {"type": "string"}},
                       "required": ["cluster_name", "dr_region"]}},
                  ]},
                "makita-postcheck-target": {
                  "desc": "Post-Check MCP Server tools",
                  "tools": [
                    {"name": "verify_new_primary_health", "description": "Verifies promoted instance health",
                     "inputSchema": {"type": "object", "properties": {
                       "cluster_name": {"type": "string"}, "dr_region": {"type": "string"}},
                       "required": ["cluster_name", "dr_region"]}},
                    {"name": "verify_endpoints", "description": "Verifies Parameter Store endpoints",
                     "inputSchema": {"type": "object", "properties": {
                       "cluster_name": {"type": "string"}}, "required": ["cluster_name"]}},
                    {"name": "verify_replication_established", "description": "Verifies replication from new primary",
                     "inputSchema": {"type": "object", "properties": {
                       "cluster_name": {"type": "string"}}, "required": ["cluster_name"]}},
                  ]},
                "makita-aws-support-target": {
                  "desc": "AWS Support Stub tools",
                  "tools": [
                    {"name": "create_support_case", "description": "Creates AWS Support case",
                     "inputSchema": {"type": "object", "properties": {
                       "subject": {"type": "string"}, "description": {"type": "string"},
                       "severity": {"type": "string"}}, "required": ["subject", "description", "severity"]}},
                    {"name": "update_support_case", "description": "Updates AWS Support case",
                     "inputSchema": {"type": "object", "properties": {
                       "case_id": {"type": "string"}, "status": {"type": "string"},
                       "update_description": {"type": "string"}}, "required": ["case_id", "status", "update_description"]}},
                  ]},
                "makita-servicenow-target": {
                  "desc": "ServiceNow Stub tools",
                  "tools": [
                    {"name": "create_ticket", "description": "Creates ServiceNow ticket",
                     "inputSchema": {"type": "object", "properties": {
                       "short_description": {"type": "string"}, "description": {"type": "string"},
                       "priority": {"type": "string"}, "category": {"type": "string"}},
                       "required": ["short_description", "description", "priority", "category"]}},
                    {"name": "update_ticket", "description": "Updates ServiceNow ticket",
                     "inputSchema": {"type": "object", "properties": {
                       "ticket_id": {"type": "string"}, "status": {"type": "string"},
                       "work_notes": {"type": "string"}}, "required": ["ticket_id", "status", "work_notes"]}},
                  ]},
              }
              # Use the agentcore manager Lambda ARN as a placeholder for all targets
              lambda_arn = props.get("ServiceToken", "")
              for tname, tdef in target_defs.items():
                safe_call(c.create_gateway_target, f"Target {tname}",
                  gatewayIdentifier=gw_id,
                  name=tname,
                  description=tdef["desc"],
                  targetConfiguration={"mcp": {"lambda": {
                    "lambdaArn": lambda_arn,
                    "toolSchema": {"inlinePayload": tdef["tools"]},
                  }}},
                  credentialProviderConfigurations=[{
                    "credentialProviderType": "GATEWAY_IAM_ROLE",
                  }],
                )

            # 3. Create Workload Identities (name only — no roleArn on this API version)
            for ident in IDENTITIES:
              safe_call(c.create_workload_identity, f"Identity {ident['name']}",
                name=ident["name"],
              )

            # 4. Create Policy Engine + Policies
            pe_id = ""
            pe = safe_call(c.create_policy_engine, "Policy Engine",
              name="makita_policy_engine",
              description="MAKITA AgentCore Policy Engine",
            )
            if pe:
              pe_id = pe.get("policyEngineId", "")
            else:
              # Already exists — look it up
              try:
                engines = c.list_policy_engines().get("policyEngines", [])
                for eng in engines:
                  if eng.get("name") == "makita_policy_engine":
                    pe_id = eng.get("policyEngineId", "")
                    print(f"Found existing Policy Engine: {pe_id}")
                    break
              except Exception as e:
                print(f"List policy engines: {e}")

            if pe_id:
              print(f"Policy Engine ID: {pe_id}")
              for name, cfg in POLICIES.items():
                safe_call(c.create_policy, f"Policy {name}",
                  name=name,
                  description=cfg["desc"],
                  definition=build_policy_doc(cfg["actions"], gw_id),
                  policyEngineId=pe_id,
                )
            else:
              print("Note: Policy Engine not available, skipping policies.")

          def delete(props):
            c = boto3.client("bedrock-agentcore-control")
            # Delete identities
            for ident in IDENTITIES:
              try:
                c.delete_workload_identity(name=ident["name"])
                print(f"Deleted identity: {ident['name']}")
              except Exception as e:
                print(f"Delete identity {ident['name']}: {e}")
            # Delete policies
            for name in POLICIES:
              for method_name in ["delete_policy"]:
                fn = getattr(c, method_name, None)
                if fn:
                  try:
                    fn(policyName=name)
                    print(f"Deleted policy: {name}")
                  except Exception as e:
                    print(f"Delete policy {name}: {e}")
            # Gateway targets + gateway
            try:
              gws = c.list_gateways().get("items", [])
              for g in gws:
                if g.get("name") == "makita-mcp-gateway":
                  gid = g["gatewayId"]
                  targets = c.list_gateway_targets(gatewayIdentifier=gid).get("items", [])
                  for t in targets:
                    try:
                      c.delete_gateway_target(gatewayIdentifier=gid, targetId=t["targetId"])
                    except Exception as e:
                      print(f"Delete target: {e}")
                  c.delete_gateway(gatewayIdentifier=gid)
                  print("Deleted gateway")
            except Exception as e:
              print(f"Delete gateway: {e}")

  MakitaGatewayLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MakitaAgentCoreLambda
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
      SourceAccount: !Ref "AWS::AccountId"

  MakitaAgentCoreResources:
    Type: Custom::AgentCoreResources
    Properties:
      ServiceToken: !GetAtt MakitaAgentCoreLambda.Arn
      FailoverRoleArn: !ImportValue makita-failover-role-arn
      PrecheckRoleArn: !ImportValue makita-precheck-role-arn
      PostcheckRoleArn: !ImportValue makita-postcheck-role-arn
      ArtifactBucket: !Ref ArtifactBucket
      ArtifactKey: !Ref ArtifactKey
      ForceUpdate: "v23-lambda-permission"

Outputs:
  AgentCoreResourceStatus:
    Value: "Created Runtime, Gateway, Targets, Identities, Policies"
