[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "makita"
version = "0.1.0"
description = "MAKITA - Machine Augmented Key Infrastructure Technology Automation"
requires-python = ">=3.11"
dependencies = [
    "strands-agents",
    "strands-agents-builder",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]
