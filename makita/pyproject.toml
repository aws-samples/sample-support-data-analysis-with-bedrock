[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makita"
version = "0.1.0"
description = "MAKITA - Machine Augmented Key Infrastructure Technology Automation"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.38.0,<2",
    "strands-agents-builder>=0.1.0,<1",
    "boto3>=1.43.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.setuptools.packages.find]
include = ["orchestrator*", "event_logs*"]

[tool.pytest.ini_options]
pythonpath = [".", "infra-cdk"]
